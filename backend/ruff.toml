# ruff の設定（NFR-12: CI での lint・フォーマットチェック）

# .python-version（3.13）と揃える。UP ルールが対象バージョンに合った書き方を判定するため
target-version = "py313"

[lint]
# デフォルトのルールに頼らず明示的に指定する。
# ・ruff の更新でチェック内容が意図せず変わるのを防ぐため
# ・Windows のフォルダを Docker にマウントすると全ファイルに実行権限が付いて見え、
#   EXE 系ルールが誤検知するため（Git 上の権限は正しく 100644）
select = [
  "E",   # PEP 8 の基本的な書き方
  "F",   # 未使用の import・未定義の変数など
  "I",   # import の並び順
  "B",   # バグになりやすい書き方
  "UP",  # 古い書き方の検出
]