# CI（NFR-12: lint・型検査・ビルド・バックエンドテストを実行する）
#
# frontend/ と backend/ の雛形は後続タスクで作成する。
# それまでは対象ファイルが無いジョブのチェックをスキップし、
# 「何も検査していないのに成功した」と誤解されないよう、スキップした旨を notice で表示する。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI はコードを読むだけなので、書き込み権限は与えない
permissions:
  contents: read

# 同じブランチで連続して push した場合、古い実行は取り消して最新だけを検査する
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend（lint・型検査・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: フロントエンドの有無を確認
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend チェックをスキップ::frontend/package.json が無いため、lint・型検査・ビルドを実行していません"
          fi

      # Node のバージョンは frontend/.nvmrc で管理する（要件定義書: バージョンは実装開始時に確定）
      - name: Node.js のセットアップ
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        if: steps.detect.outputs.exists == 'true'
        run: npm ci

      # 書き方の問題は数秒で分かるため、時間のかかる型検査・ビルドより先に実行する
      - name: lint
        if: steps.detect.outputs.exists == 'true'
        run: npm run lint

      - name: 型検査
        if: steps.detect.outputs.exists == 'true'
        run: npm run typecheck

      - name: ビルド
        if: steps.detect.outputs.exists == 'true'
        run: npm run build

  backend:
    name: Backend（lint・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: バックエンドの有無を確認
        id: detect
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend チェックをスキップ::backend/requirements.txt が無いため、lint・テストを実行していません"
          fi

      # Python のバージョンは backend/.python-version で管理する
      - name: Python のセットアップ
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 依存関係のインストール
        if: steps.detect.outputs.exists == 'true'
        run: pip install -r requirements.txt

      # ルールは backend/ruff.toml で管理する。テストより先に実行し、書き方の問題を早く検出する
      - name: lint
        if: steps.detect.outputs.exists == 'true'
        run: ruff check .

      - name: フォーマットチェック
        if: steps.detect.outputs.exists == 'true'
        run: ruff format --check .

      # `pytest` 単体だと backend/ 直下のモジュールをテストから import できないため、
      # カレントディレクトリを import パスに含める `python -m pytest` で実行する
      - name: テスト
        if: steps.detect.outputs.exists == 'true'
        run: python -m pytest